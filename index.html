<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Reality - Portal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <div class="lang-toggle">
            <button class="lang-btn active" onclick="setLanguage('ru')" data-lang="ru">РУС</button>
            <button class="lang-btn" onclick="setLanguage('en')" data-lang="en">ENG</button>
        </div>
        <h1>Meet Reality</h1>
        <p class="tagline">Discover your tools</p>
    </div>

    <div class="main">
        <div class="container">
            <div class="portal-buttons">
                <button class="btn-portal" onclick="window.location.href='calculator.html'">Delusion Calculator</button>
                <button class="btn-portal" onclick="alert('Tool 2')"></button>
                <button class="btn-portal" onclick="alert('Tool 3')"></button>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Meet Reality. Portal for tools.</p>
    </div>

    <script>
        let lang = 'ru';

        const i18n = {
            ru: {
                title: 'Meet Reality',
                tagline: 'Откройте для себя свои инструменты'
            },
            en: {
                title: 'Meet Reality',
                tagline: 'Discover your tools'
            }
        };

        function t(key) {
            return i18n[lang][key] || key;
        }

        function setLanguage(newLang) {
            lang = newLang;
            document.querySelector('h1').textContent = t('title');
            document.querySelector('.tagline').textContent = t('tagline');
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('ru');
        });
    </script>
</body>
</html>
