<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meet Reality - Portal</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="header">
        <div class="lang-toggle">
            <button class="lang-btn" onclick="setLanguage('ru')" data-lang="ru">РУС</button>
            <button class="lang-btn active" onclick="setLanguage('en')" data-lang="en">ENG</button>
        </div>
        <h1 data-i18n="title">Meet Reality</h1>
        <p class="tagline" data-i18n="tagline">Discover your tools</p>
    </div>

    <div class="main">
        <div class="container">
            <div class="portal-buttons">
                <button class="btn-portal" onclick="window.location.href='html/calculator.html'">Delusion Calculator</button>
                <button class="btn-portal" onclick="window.location.href='html/dating_tips.html'">How Realistic Are Your Dating Standard</button>
                <button class="btn-portal" onclick="window.location.href='html/dating_apps_links.html'">Dating Apps</button>
            </div>

            <div class="ad-space">
                <span data-i18n="adPlaceholder">Ad Space</span>
                <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7925278724142761" crossorigin="anonymous"></script>
                <!-- Replace data-ad-slot with your actual Ad Unit ID -->
                <ins class="adsbygoogle"
                     style="display:block"
                     data-ad-client="ca-pub-7925278724142761"
                     data-ad-slot="1234567890"
                     data-ad-format="auto"
                     data-full-width-responsive="true"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>© 2026 Meet Reality. Portal for tools.</p>
    </div>

    <script>
        let lang = 'en';

        const i18n = {
            ru: {
                title: 'Meet Reality',
                tagline: 'Откройте для себя свои инструменты',
                adPlaceholder: 'Место для объявлений'
            },
            en: {
                title: 'Meet Reality',
                tagline: 'Discover your tools',
                adPlaceholder: 'Ad Space'
            }
        };

        function t(key) {
            return i18n[lang][key] || key;
        }

        function setLanguage(newLang) {
            lang = newLang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.getAttribute('data-i18n'));
            });
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        window.addEventListener('DOMContentLoaded', () => {
            setLanguage('en');
        });
    </script>
</body>
</html>
