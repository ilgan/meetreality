<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Calculator Data Connection</title>
</head>
<body>
    <h1>Testing Calculator Data Connection</h1>
    <div id="results"></div>

    <script>
        async function testDataConnection() {
            try {
                const res = await fetch('us_demographics.json');
                const data = await res.json();

                let output = '<h2>Data Loaded Successfully</h2>';

                // Check if distributions exist
                if (data.distributions) {
                    output += '<h3>Distributions Found:</h3><ul>';
                    for (const [key, value] of Object.entries(data.distributions)) {
                        output += `<li>${key}: ${JSON.stringify(value)}</li>`;
                    }
                    output += '</ul>';
                } else {
                    output += '<p style="color: red;">ERROR: Distributions not found in data!</p>';
                }

                // Check if states exist
                if (data.states && data.states.length > 0) {
                    output += `<p>States data: ${data.states.length} states loaded.</p>`;
                } else {
                    output += '<p style="color: red;">ERROR: States data not found!</p>';
                }

                // Simulate a simple calculation
                const sex = 'male';
                const ageMin = 28;
                const ageMax = 35;
                const salaryCat = 'medium';
                const heightCat = 'average';
                const weight = 'normal';
                const married = 'single';
                const hasKids = 'no';

                let matches = 0;
                let totalOfSex = 0;

                for (let state of data.states) {
                    const sexCount = state.sex[sex];
                    totalOfSex += sexCount;

                    const totalPop = state.population;
                    for (let [ageGroup, count] of Object.entries(state.age_distribution)) {
                        const ageMid = getAgeMid(ageGroup);
                        if (ageMid >= ageMin && ageMid <= ageMax) {
                            let sexInGroup = (count / totalPop) * sexCount;
                            sexInGroup *= data.distributions.salary[salaryCat];
                            sexInGroup *= data.distributions.height[heightCat];
                            sexInGroup *= data.distributions.weight[weight];
                            sexInGroup *= data.distributions.marital[married];
                            sexInGroup *= data.distributions.kids[hasKids];
                            matches += sexInGroup;
                        }
                    }
                }

                const percent = totalOfSex > 0 ? ((matches / totalOfSex) * 100).toFixed(2) : 0;
                output += `<p>Sample Calculation: ${percent}% match for male, age 28-35, medium salary, average height, normal weight, single, no kids.</p>`;

                document.getElementById('results').innerHTML = output;

            } catch (e) {
                document.getElementById('results').innerHTML = `<p style="color: red;">ERROR: ${e.message}</p>`;
            }
        }

        function getAgeMid(bracket) {
            const ranges = {
                '18_24': 21.5, '25_34': 30.5, '35_44': 40.5,
                '45_54': 50.5, '55_64': 60.5, '65_plus': 72
            };
            return ranges[bracket] || 50;
        }

        window.addEventListener('DOMContentLoaded', testDataConnection);
    </script>
</body>
</html>
